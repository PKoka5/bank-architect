# Newest first. These are published releases, not pending development changes.
versions=0.9.7,0.9.6,0.9.5,0.9.4,0.9.3,0.9.2,0.9.1,0.9.0,0.8.1,0.8.0,0.7.1,0.7.0,0.6.0
notice=<h2>What's new</h2><p>Bank Architect {version}</p><h3>Move complete blueprint tabs</h3><p>Use Up and Down in Tab Layout to move a whole blueprint tab, including saved item order. Editing a built-in preset creates a Custom layout.</p><h3>More stable Alch choices</h3><p>Reviewed Alch stock stays put as quantities change or become placeholders. Withdrawn upgrades still count for reviewed replacements.</p><p>Ordinary d'hide needs full-stat replacement proof. Rune maces stay available for Bone mace crafting when a spine is present and no Bone mace is recorded.</p><h3>Combat fixes</h3><p>Corrected Obsidian platebody progression and general Ranged helmet selection.</p><p>Your item choices keep priority. Every real bank move remains manual.</p>
0.9.7=<h2>Bank Architect 0.9.7</h2><h3>Reorder blueprint tabs</h3><p>Tab Layout has Up and Down controls for complete destinations, including Main and empty tabs. Saved item orders and custom routes follow the moved tab. Editing a built-in preset creates a Custom layout.</p><h3>Stable and more careful Alch</h3><p>Reviewed stock remains Alch when quantities fall or placeholders remain, including after restart. Reviewed tool, staff, Mystic-colour and slash-weapon replacement rules also recognize withdrawn upgrades.</p><p>Ordinary d'hide bodies and chaps require full-stat replacement evidence. A Rune mace stays available when a real Scurrius' spine is present and no Bone mace or its placeholder exists.</p><h3>Combat corrections</h3><p>Obsidian platebody has its correct progression tier. General Ranged helmet selection prioritizes Ranged damage and accuracy before defensive tie-breakers; Bowfa and Crystal armour retain their contextual priority.</p><p>Personal item choices and saved physical layouts keep priority. Every real bank move remains manual.</p>
0.9.6=<h2>Bank Architect 0.9.6</h2><h3>Bank blueprint preview</h3><p>Open Blueprint temporarily draws the planned layout over the bank item area while preserving normal tabs, buttons and scrolling. Main shows all planned sections; tabs switch without ending preview. Closing the blueprint or bank restores the real view. Preview never moves items.</p><h3>Complete Combat columns</h3><p>Best owned Melee, Ranged and Magic gear forms full vertical equipment columns. Other armour sets stay vertical, weapons group by function and rings stay together. Shared gear appears once.</p><h3>Supplies, tools and teleports</h3><p>Main puts complete 4-3-2-1 potion families before incomplete families. Ironman puts complete Herblore recipe rows first, then compact ingredients by kind.</p><p>Prospector, Eye, Angler and other reviewed outfit variants stay grouped, including compatible mixed colours. Cannon components sit beside Slayer tools. Teleport tablets group by icon colour.</p><p>Deadman Crystal equipment and Construction/Crafting cape roles corrected. Your own item corrections, custom layouts and saved item orders keep priority. All sorting remains manual.</p>
0.9.5=<h2>Bank Architect 0.9.5</h2><h3>Sidebar shortcuts</h3><p>Three header icons open Updates, Settings and GitHub issues.</p><p>Updates contains the full bundled history with a version chooser and a return button.</p><p>Settings opens this plugin's RuneLite configuration. GitHub opens a new issue directly.</p><p>Reading history preserves your blueprint and does not acknowledge an unseen update.</p>
0.9.4=<h2>Bank Architect 0.9.4</h2><h3>Drag and scroll guidance</h3><p>Blue destination markers stay visible while dragging through long bank tabs.</p><p>Scroll instructions point toward DROP/TO while holding the advised item; cancelling restores FROM guidance.</p>
0.9.3=<h2>Bank Architect 0.9.3</h2><h3>Combat and ammunition</h3><p>Best gear leads each style column; other armour sets stay together vertically.</p><p>Separate weapon roles, Crystal armour beside Bowfa, and broader recent-gear coverage.</p><p>Arrows, bolts, darts and cannonballs form ordered groups in Slayer &amp; Boss Loot.</p><p>Faster dense Combat previews.</p>
0.9.2=<h2>Bank Architect 0.9.2</h2><h3>More stable placement</h3><p>Reviewed armour upgrades count even when represented by bank placeholders.</p><p>Depositing new items preserves compatible existing Alch choices.</p><p>Better Combat progression and equipment-slot coverage.</p><p>Guidance recognizes suitable neighboring tabs for whole-tab moves and reduces later Insert moves.</p>
0.9.1=<h2>Bank Architect 0.9.1</h2><h3>Classification and placeholders</h3><p>Withdrawing preferred gear with placeholders preserves compatible Gear/Alch choices during the current session.</p><p>Corrected currencies, diary rewards, utility items and other reviewed classifications.</p><p>Unknown items cannot become automatic Alch candidates solely from stats, value or quantity.</p>
0.9.0=<h2>Bank Architect 0.9.0</h2><h3>Main and custom presets</h3><p>Choose Ironman, Main or a saved custom preset from one sidebar selector. Editing a bundled preset creates a custom layout.</p><p>Main groups runes and teleports together, orders potions 4-3-2-1, and arranges farming supplies by stage.</p><p>Shared Alch rules recognize reviewed armour, tool, weapon and staff replacements.</p><p>Cannon parts stay grouped. Spiked boots and heraldic Rune helms receive corrected destinations.</p>
0.8.1=<h2>Bank Architect 0.8.1</h2><h3>Keep your tab order</h3><p>Keep current order accepts a tab's current arrangement while still guiding transfers into and out of it.</p><p>Completion, move estimates and slot colors follow that choice.</p><p>Named layouts and share codes preserve these per-tab choices.</p>
0.8.0=<h2>Bank Architect 0.8.0</h2><h3>Save your bank as a blueprint</h3><p>Save current bank captures Main, numbered tabs and item order as a new named blueprint.</p><p>Captured layouts support mixed categories, placeholders and repeated physical copies.</p><p>Fixed analysis failures involving fishing tools, tinderboxes and outfit layouts.</p><p>More reliable saved layouts, editor scrolling and Alch suggestions.</p>
0.7.1=<h2>Bank Architect 0.7.1</h2><h3>Better quick-access tools</h3><p>Working Imcando hammers and Jeweller's chisel take priority over ordinary tools.</p><p>Placeholders preserve the selected upgrade while it is withdrawn.</p><p>Broken hammers do not qualify as upgrades; manual assignments retain priority.</p>
0.7.0=<h2>Bank Architect 0.7.0</h2><h3>Clearer sidebar and item roles</h3><p>Simpler RuneLite-style sidebar and direct destination selection in the blueprint editor.</p><p>Improved hunter supplies, cosmetics, quest utilities and outfit grouping.</p><p>Tooltips describe reviewed item uses and clue requirements.</p><p>Conditional storage hints for the Tool Leprechaun, seed vault and fancy-dress box.</p>
0.6.0=<h2>Bank Architect 0.6.0</h2><h3>Blueprint editing</h3><p>Click to select an item, then Swap or Insert it. Move items between blueprint tabs.</p><p>Undo, Cancel, Save and per-tab reset support local blueprint changes.</p><p>Deposits and withdrawals refresh analysis; placeholders preserve preferred tools.</p><p>Dismissible update notices remember acknowledgement locally.</p>
