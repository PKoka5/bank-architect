// Optional development-only task; not part of the plugin or its standard build.
allprojects {
	plugins.withId('java') {
		tasks.register('compileCombatLayoutSimulation', JavaCompile) {
			dependsOn tasks.named('classes')
			setSource(project.files(new File(project.projectDir, 'tools/research/combat-layout-simulation/CombatLayoutSimulation.java')))
			classpath = sourceSets.test.runtimeClasspath
			destinationDirectory = layout.buildDirectory.dir('tmp/combat-layout-visual/classes')
			options.encoding = 'UTF-8'
			sourceCompatibility = '11'
			targetCompatibility = '11'
		}
		tasks.register('simulateCombatLayoutVisual', JavaExec) {
			dependsOn tasks.named('compileCombatLayoutSimulation')
			classpath = files(layout.buildDirectory.dir('tmp/combat-layout-visual/classes')) + sourceSets.test.runtimeClasspath
			mainClass = 'com.pkoka5.ironmanbankarchitect.organize.CombatLayoutSimulation'
			args project.property('visualOutput'), project.property('visualStats'),
				project.property('visualMainExport'), project.property('visualIronmanExport'), project.property('visualAlchMapping')
			if (project.hasProperty('visualLatestExport')) args project.property('visualLatestExport')
		}
	}
}
